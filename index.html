<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">


<title>
小赵私厨点菜
</title>


<!-- Supabase SDK -->

<script src="
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
"></script>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

background:#f7f5f0;

font-family:
"Microsoft YaHei",
sans-serif;

color:#333;

}



.header{

background:white;

padding:20px;

text-align:center;

position:sticky;

top:0;

z-index:10;

box-shadow:
0 2px 10px rgba(0,0,0,.08);

}



.header h1{

margin:0;

font-size:26px;

letter-spacing:3px;

}



.header p{

margin:8px 0 0;

color:#888;

font-size:14px;

}




/* 分类按钮 */


.category{

display:flex;

overflow-x:auto;

background:white;

padding:10px;

gap:10px;

}



.category button{


border:none;

background:#eee;

padding:8px 18px;

border-radius:20px;

font-size:14px;

}



.category button.active{


background:#333;

color:white;


}




/* 菜品列表 */


.menu{

padding:15px;

}



.food-card{


background:white;

border-radius:15px;

margin-bottom:18px;

overflow:hidden;

box-shadow:

0 4px 15px rgba(0,0,0,.08);


}



.food-card img{


width:100%;

height:180px;

object-fit:cover;


}




.food-info{


padding:15px;

}



.food-name{


font-size:20px;

font-weight:bold;


}



.food-type{


color:#888;

font-size:14px;

margin-top:8px;


}




.remark{


width:100%;

margin-top:12px;

padding:10px;

border-radius:8px;

border:1px solid #ddd;

font-size:14px;

}



.add-btn{


width:100%;

margin-top:12px;

padding:12px;

border:none;

border-radius:10px;

background:#222;

color:white;

font-size:16px;


}



/* 底部购物栏 */


.cart-bar{


position:fixed;

bottom:0;

left:0;

right:0;


background:white;


padding:12px 15px;


display:flex;


justify-content:space-between;


align-items:center;


box-shadow:

0 -3px 15px rgba(0,0,0,.1);


}



.cart-count{


font-size:16px;

font-weight:bold;

}



.cart-btn{


background:#222;

color:white;

border:none;

padding:12px 25px;

border-radius:25px;


}



/* 弹窗 */


.modal{


display:none;


position:fixed;


left:0;

right:0;

top:0;

bottom:0;


background:

rgba(0,0,0,.45);


z-index:100;


}



.modal-box{


background:white;

width:90%;

max-height:80%;

overflow:auto;

margin:80px auto;


border-radius:20px;


padding:20px;


}



.modal-title{


font-size:22px;

font-weight:bold;

margin-bottom:15px;


}



.order-item{


border-bottom:1px solid #eee;

padding:12px 0;


}



.name-input{


width:100%;

padding:12px;

border-radius:10px;

border:1px solid #ddd;

margin-bottom:15px;

font-size:16px;


}



.submit-btn{


width:100%;

background:#d35400;

color:white;

border:none;

padding:14px;

border-radius:12px;

font-size:17px;


}



.close-btn{


width:100%;

margin-top:10px;

padding:12px;

border:none;

background:#eee;

border-radius:12px;


}


</style>

</head>


<body>



<div class="header">


<h1>
东北私厨
</h1>


<p>
家常味道 · 手机点菜
</p>


</div>



<div class="category">


<button class="active"
onclick="changeCategory('全部')">

全部

</button>


<button onclick="changeCategory('素菜')">

素菜

</button>


<button onclick="changeCategory('荤菜')">

荤菜

</button>


<button onclick="changeCategory('凉菜')">

凉菜

</button>


<button onclick="changeCategory('汤')">

汤

</button>


</div>



<div id="menu"
class="menu">

</div>



<div class="cart-bar">


<div class="cart-count">

已选：
<span id="cartCount">
0
</span>
道菜

</div>


<button class="cart-btn"
onclick="openCart()">

查看菜单

</button>


</div>



<div id="cartModal"
class="modal">


<div class="modal-box">


<div class="modal-title">

确认订单

</div>



<input
id="username"
class="name-input"
placeholder="请输入您的姓名">



<div id="orderList">

</div>



<button
class="submit-btn"
onclick="submitOrder()">

提交订单

</button>



<button
class="close-btn"
onclick="closeCart()">

关闭

</button>


</div>


</div>



<script>


// ================================
// Supabase 配置
// ================================


const SUPABASE_URL =

"https://ovrhpmcvxfvhkqzlfjgd.supabase.co";



const SUPABASE_KEY =

"sb_publishable_-D9hxijmh3gvmfOAUS47Bw_77j_9Y2Q";



const supabaseClient =

supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);


// ================================
// 菜品数据库
// ================================


const foods = [


{
name:"西红柿炒鸡蛋",
type:"素菜",
image:"images/西红柿炒鸡蛋.png"
},


{
name:"清水小白菜",
type:"素菜",
image:"images/清水小白菜.png"
},


{
name:"酸菜炒粉条",
type:"素菜",
image:"images/酸菜炒粉条.png"
},


{
name:"土豆炖茄子",
type:"素菜",
image:"images/土豆炖茄子.png"
},


{
name:"东北大饭包",
type:"素菜",
image:"images/东北大饭包.png"
},




{
name:"红烧土豆排骨",
type:"荤菜",
image:"images/红烧土豆排骨.png"
},


{
name:"红烧鱼",
type:"荤菜",
image:"images/红烧鱼.png"
},


{
name:"香辣肉丝",
type:"荤菜",
image:"images/香辣肉丝.png"
},


{
name:"蒜苔炒肉",
type:"荤菜",
image:"images/蒜苔炒肉.png"
},


{
name:"尖椒炒肉",
type:"荤菜",
image:"images/尖椒炒肉.png"
},


{
name:"红烧肉",
type:"荤菜",
image:"images/红烧肉.png"
},


{
name:"照烧鸡排",
type:"荤菜",
image:"images/照烧鸡排.png"
},


{
name:"可乐鸡翅",
type:"荤菜",
image:"images/可乐鸡翅.png"
},


{
name:"东北杀猪菜",
type:"荤菜",
image:"images/东北杀猪菜.png"
},




{
name:"拍黄瓜",
type:"凉菜",
image:"images/拍黄瓜.png"
},


{
name:"凉拌菠菜",
type:"凉菜",
image:"images/凉拌菠菜.png"
},


{
name:"拌豆腐",
type:"凉菜",
image:"images/拌豆腐.png"
},


{
name:"酸辣土豆丝",
type:"凉菜",
image:"images/酸辣土豆丝.png"
},


{
name:"凉拌干豆腐",
type:"凉菜",
image:"images/凉拌干豆腐.png"
},



{
name:"土豆菠菜汤",
type:"汤",
image:"images/土豆菠菜汤.png"
},


{
name:"白菜豆腐汤",
type:"汤",
image:"images/白菜豆腐汤.png"
}



];





// ================================
// 当前分类
// ================================


let currentCategory="全部";



// ================================
// 已选订单
// ================================


let order=[];





// ================================
// 渲染菜品
// ================================


function renderMenu(){


let html="";



foods.forEach((food,index)=>{


if(

currentCategory!="全部"

&&

food.type!=currentCategory

){

return;

}



html+=`

<div class="food-card">


<img src="${food.image}">



<div class="food-info">


<div class="food-name">

${food.name}

</div>



<div class="food-type">

${food.type}

</div>



<textarea

class="remark"

id="remark-${index}"

placeholder="备注：少辣、不放葱、加辣">

</textarea>




<button

class="add-btn"

onclick="addFood(${index})">

加入菜单

</button>



</div>


</div>

`;



});



document.getElementById("menu")

.innerHTML=html;


}





// ================================
// 分类切换
// ================================


function changeCategory(type){


currentCategory=type;


renderMenu();


}




// ================================
// 加入购物车
// ================================


function addFood(index){


let remark=

document.getElementById(

"remark-"+index

).value;



order.push({

name:foods[index].name,

remark:remark


});



document.getElementById(

"cartCount"

).innerHTML=

order.length;



alert(

foods[index].name+" 已加入菜单"

);



}


// ================================
// 打开购物车
// ================================


function openCart(){


let html="";



if(order.length==0){


html="暂无选择菜品";


}

else{


order.forEach((item,index)=>{


html+=`

<div class="order-item">


<h3>

${item.name}

</h3>


<p>

备注：

${item.remark || "无"}

</p>



<button

onclick="deleteFood(${index})">

删除

</button>


</div>


`;



});


}



document.getElementById(

"orderList"

).innerHTML=html;



document.getElementById(

"cartModal"

).style.display="block";



}





// ================================
// 关闭购物车
// ================================


function closeCart(){


document.getElementById(

"cartModal"

).style.display="none";


}






// ================================
// 删除菜品
// ================================


function deleteFood(index){


order.splice(index,1);



document.getElementById(

"cartCount"

).innerHTML=

order.length;



openCart();



}






// ================================
// 提交订单到 Supabase
// ================================


async function submitOrder(){



// 判断是否有菜


if(order.length===0){


alert(

"请先选择菜品"

);


return;


}





// 获取姓名


let username=

document.getElementById(

"username"

).value.trim();





if(username===""){


alert(

"请输入您的姓名"

);


return;


}





// 菜品字符串


let foodsText=

order

.map(

item=>item.name

)

.join(",");






// 备注字符串


let remarkText=

order

.map(

item=>


item.name+

"："+

(item.remark || "无")

)

.join("\n");






// 写入数据库


const {

data,

error

}=

await supabaseClient

.from("orders")

.insert([


{


username:username,


foods:foodsText,


remark:remarkText


}


]);







if(error){



console.log(error);



alert(

"提交失败："

+

error.message

);



return;


}





alert(

"菜单提交成功！"

+

"\n小赵厨师已经收到您的点餐"

);






// 清空


order=[];



document.getElementById(

"cartCount"

).innerHTML="0";



document.getElementById(

"username"

).value="";



closeCart();




}




// ================================
// 页面启动
// ================================


renderMenu();


</script>


</body>


</html>
