<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0">


<title>
东北私厨点菜
</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

background:#f7f5f0;

font-family:
"Microsoft YaHei",
Arial;

padding-bottom:90px;

}



/*顶部*/

.header{

background:#8b0000;

color:white;

padding:18px;

text-align:center;

font-size:22px;

font-weight:bold;

}



/*分类*/

.category{

display:flex;

overflow-x:auto;

background:white;

padding:12px;

gap:10px;

position:sticky;

top:0;

z-index:10;

}



.category button{

border:none;

background:#eee;

padding:8px 18px;

border-radius:20px;

white-space:nowrap;

}



.category .active{

background:#8b0000;

color:white;

}



/*菜品*/

.menu{

padding:15px;

}



.food{

background:white;

border-radius:15px;

margin-bottom:18px;

overflow:hidden;

box-shadow:
0 3px 10px rgba(0,0,0,.1);

}



.food img{

width:100%;

height:210px;

object-fit:cover;

}



.info{

padding:15px;

}



.name{

font-size:20px;

font-weight:bold;

}



.type{

color:#888;

margin:8px 0;

}



textarea{

width:100%;

height:55px;

border-radius:10px;

border:1px solid #ddd;

padding:10px;

}



.add{

width:100%;

margin-top:10px;

background:#d2691e;

color:white;

border:none;

padding:12px;

border-radius:25px;

font-size:16px;

}



/*订单*/

.cart{


position:fixed;

bottom:0;

left:0;

right:0;


background:white;


padding:15px;


box-shadow:
0 -3px 10px rgba(0,0,0,.15);


display:flex;

justify-content:space-between;

align-items:center;


}



.cart button{


background:#8b0000;

color:white;

border:none;

padding:12px 25px;

border-radius:25px;


}




/*弹窗*/


.modal{


display:none;


position:fixed;


top:0;

left:0;

right:0;

bottom:0;


background:white;


z-index:100;


padding:20px;


overflow:auto;


}



.item{

border-bottom:
1px solid #ddd;

padding:15px 0;

}


.delete{

background:#aaa;

color:white;

border:none;

padding:5px 15px;

border-radius:15px;

}


</style>

</head>



<body>



<div class="header">

🍲 东北私厨菜单

</div>




<div class="category">


<button onclick="changeType('全部')">
全部
</button>


<button onclick="changeType('素菜')">
🥬素菜
</button>


<button onclick="changeType('荤菜')">
🍖荤菜
</button>


<button onclick="changeType('凉菜')">
🥗凉菜
</button>


<button onclick="changeType('汤')">
🍲汤
</button>


</div>





<div id="menu"
class="menu">

</div>





<div class="cart">


<div>

🛒 已选：

<span id="count">
0
</span>

道菜

</div>



<button onclick="openCart()">

查看菜单

</button>



</div>





<div id="modal"
class="modal">


<h2>

我的点菜单

</h2>



<div id="order">

</div>


<button onclick="closeCart()">

返回

</button>


</div>






<script>


let foods=[



{
name:"西红柿炒鸡蛋",
type:"素菜",
image:"images/西红柿炒鸡蛋.png"
},


{
name:"清水小白菜",
type:"素菜",
image:"images/清水小白菜.png"
},


{
name:"酸菜炒粉条",
type:"素菜",
image:"images/酸菜炒粉条.png"
},


{
name:"土豆炖茄子",
type:"素菜",
image:"images/土豆炖茄子.png"
},


{
name:"东北大饭包",
type:"素菜",
image:"images/东北大饭包.png"
},




{
name:"红烧土豆排骨",
type:"荤菜",
image:"images/红烧土豆排骨.png"
},


{
name:"红烧鱼",
type:"荤菜",
image:"images/红烧鱼.png"
},


{
name:"香辣肉丝",
type:"荤菜",
image:"images/香辣肉丝.png"
},


{
name:"蒜苔炒肉",
type:"荤菜",
image:"images/蒜苔炒肉.png"
},


{
name:"尖椒炒肉",
type:"荤菜",
image:"images/尖椒炒肉.png"
},


{
name:"红烧肉",
type:"荤菜",
image:"images/红烧肉.png"
},


{
name:"照烧鸡排",
type:"荤菜",
image:"images/照烧鸡排.png"
},


{
name:"可乐鸡翅",
type:"荤菜",
image:"images/可乐鸡翅.png"
},


{
name:"东北杀猪菜",
type:"荤菜",
image:"images/东北杀猪菜.png"
},





{
name:"拍黄瓜",
type:"凉菜",
image:"images/拍黄瓜.png"
},


{
name:"凉拌菠菜",
type:"凉菜",
image:"images/凉拌菠菜.png"
},


{
name:"拌豆腐",
type:"凉菜",
image:"images/拌豆腐.png"
},


{
name:"酸辣土豆丝",
type:"凉菜",
image:"images/酸辣土豆丝.png"
},


{
name:"凉拌干豆腐",
type:"凉菜",
image:"images/凉拌干豆腐.png"
},



{
name:"土豆菠菜汤",
type:"汤",
image:"images/土豆菠菜汤.png"
},


{
name:"白菜豆腐汤",
type:"汤",
image:"images/白菜豆腐汤.png"
}



];





let order=[];


let current="全部";



function render(){


let html="";


foods.forEach((f,i)=>{


if(
current!="全部"
&&
f.type!=current
)
return;



html+=`

<div class="food">


<img src="${f.image}">


<div class="info">


<div class="name">

${f.name}

</div>


<div class="type">

${f.type}

</div>



<textarea

id="remark${i}"

placeholder="备注：少辣、不放葱、加辣">

</textarea>



<button class="add"

onclick="add(${i})">

加入菜单

</button>


</div>


</div>

`;



});


document.getElementById("menu").innerHTML=html;


}





function changeType(t){

current=t;

render();

}





function add(i){


let remark=
document.getElementById(
"remark"+i
).value;



order.push({

name:foods[i].name,

remark:remark

});


document.getElementById("count").innerHTML=
order.length;


alert(
foods[i].name+" 已加入"
);


}







function openCart(){


let html="";


order.forEach((x,i)=>{


html+=`

<div class="item">

<h3>
${x.name}
</h3>


<p>
备注：
${x.remark||"无"}
</p>


<button class="delete"
onclick="del(${i})">

删除

</button>


</div>


`;


});



if(html=="")
html="暂无菜品";



document.getElementById("order")
.innerHTML=html;



document.getElementById("modal")
.style.display="block";


}



function closeCart(){

document.getElementById("modal")
.style.display="none";

}



function del(i){


order.splice(i,1);


document.getElementById("count")
.innerHTML=order.length;


openCart();


}



render();


</script>


</body>

</html>
