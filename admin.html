<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
小赵订单管理后台
</title>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f5f5;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

}




.header{


background:#8b0000;

color:white;

text-align:center;

padding:20px;

font-size:24px;

font-weight:bold;


}




.container{


padding:15px;

max-width:600px;

margin:auto;


}




.refresh-btn{


width:100%;

padding:15px;

background:#222;

color:white;

border:none;

border-radius:12px;

font-size:16px;

margin-bottom:20px;


}




.order-card{


background:white;

padding:18px;

border-radius:15px;

margin-bottom:15px;

box-shadow:

0 4px 12px rgba(0,0,0,.12);


}




.username{


font-size:22px;

font-weight:bold;

color:#8b0000;

}




.foods{


font-size:18px;

margin-top:15px;

line-height:1.6;


}




.remark{


margin-top:12px;

padding:12px;

background:#fafafa;

border-radius:10px;

line-height:1.7;


}



.time{


font-size:13px;

color:#888;

margin-top:15px;


}



.delete-btn{


width:100%;

margin-top:15px;

padding:12px;

border:none;

border-radius:10px;

background:#d9534f;

color:white;

font-size:16px;


}




.empty{


text-align:center;

color:#999;

font-size:18px;

margin-top:50px;


}



</style>


</head>



<body>


<div class="header">

🍲 小赵的订单后台

</div>




<div class="container">


<button

class="refresh-btn"

onclick="loadOrders()">

刷新订单

</button>



<div id="orders">


</div>


</div>





<script>


// ===============================
// Supabase 配置
// ===============================



const SUPABASE_URL =


"https://ovrhpmcvxfvhkqzlfjgd.supabase.co";



const SUPABASE_KEY =


"sb_publishable_-D9hxijmh3gvmfOAUS47Bw_77j_9Y2Q";





const supabaseClient =


supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);







// ===============================
// 获取订单
// ===============================



async function loadOrders(){



const {

data,

error

}=


await supabaseClient


.from("orders")


.select("*")


.order(

"id",

{

ascending:false

}

);




if(error){


alert(

"读取失败："+

error.message

);


return;


}





let html="";





if(!data || data.length===0){


html=`

<div class="empty">

暂无订单

</div>

`;


}

else{


data.forEach(item=>{


html+=`

<div class="order-card">


<div class="username">

👤 ${item.username}

</div>



<div class="foods">


🍽 菜品：

<br>

${item.foods}


</div>




<div class="remark">


📝 备注：

<br>


${

(item.remark || "无")

.replace(

/\\n/g,

"<br>"

)

}


</div>




<div class="time">


⏰

${

new Date(

item.created_at

)

.toLocaleString()

}


</div>




<button

class="delete-btn"

onclick="deleteOrder(${item.id})">


删除订单


</button>




</div>


`;



});


}




document.getElementById(

"orders"

)

.innerHTML=html;



}







// ===============================
// 删除订单
// ===============================



async function deleteOrder(id){



let ok=

confirm(

"确定删除这个订单吗？"

);



if(!ok){

return;

}




const {

error

}=


await supabaseClient


.from("orders")


.delete()


.eq(

"id",

id

);




if(error){


alert(

"删除失败"

);


}

else{


alert(

"删除成功"

);


loadOrders();


}



}






// 页面打开自动加载

loadOrders();



</script>



</body>

</html>
